services:
  - type: worker
    name: fantasy-league-assistant
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FANTASYPROS_API_KEY
        sync: false
      - key: FANTASYPROS_BASE_URL
        value: https://api.fantasypros.com/public/v2/json
      - key: FANTASYPROS_DEFAULT_RANKING_TYPE
        value: DRAFT
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
